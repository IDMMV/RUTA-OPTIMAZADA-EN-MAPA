<style>
:root {
  --bg:#f5f7fb;
  --panel:#ffffff;
  --text:#172033;
  --muted:#6b7485;
  --line:#dfe5ee;
  --primary:#1267ef;
  --primary-dark:#0d52bf;
  --primary-soft:#eaf2ff;
  --danger:#d94343;
  --success:#198754;
  --shadow:0 8px 24px rgba(22,34,55,.08);
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}
button,a{cursor:pointer}
.app-shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}
.sidebar{background:#fff;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:1100}
.brand{display:flex;gap:10px;align-items:center;padding:2px 10px 24px}.brand-mark{width:38px;height:38px;background:var(--primary);color:#fff;border-radius:14px;display:grid;place-items:center;transform:rotate(45deg)}.brand-mark::first-letter{transform:rotate(-45deg)}.brand strong,.brand span{display:block;font-size:18px;line-height:1.1}.brand span{color:var(--primary);font-weight:700}
.nav{display:flex;flex-direction:column;gap:8px}.nav-item{border:0;background:transparent;color:#344054;padding:12px 14px;border-radius:12px;text-align:left;display:flex;gap:12px;align-items:center}.nav-item:hover,.nav-item.active{background:var(--primary-soft);color:var(--primary);font-weight:700}.side-note{margin-top:auto;background:var(--primary-soft);padding:16px;border-radius:14px;display:flex;gap:8px;flex-direction:column}.side-note span{font-size:13px;color:var(--muted)}
.main{min-width:0;padding:18px 20px 30px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.topbar h1{margin:0;font-size:26px}.topbar p{margin:5px 0 0;color:var(--muted)}.top-actions{display:flex;gap:10px;align-items:center}
.view{display:none}.view.active{display:block}.planner-grid{display:grid;grid-template-columns:minmax(360px,470px) minmax(0,1fr);gap:16px;align-items:start}.control-column{display:flex;flex-direction:column;gap:14px}.card,.page-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.card{padding:16px}.page-card{padding:20px;min-height:70vh}.card-head{margin-bottom:12px}.card-head.inline{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.card h2,.page-card h2{margin:0 0 4px;font-size:18px}.card p,.page-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.input,.textarea{width:100%;border:1px solid #cfd8e6;background:#fff;border-radius:12px;padding:11px 12px;color:var(--text);outline:none}.input:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(18,103,239,.12)}.textarea{resize:vertical;min-height:130px}.row{display:flex}.gap{gap:8px}.resolved-text{margin-top:9px;color:var(--muted);font-size:13px}.button-row{display:flex;gap:9px;margin-top:12px}.button-row.wrap{flex-wrap:wrap}.button-row.right{justify-content:flex-end}.grow{flex:1}.primary-btn,.secondary-btn,.ghost-btn,.danger-btn,.icon-btn{border-radius:11px;padding:10px 13px;border:1px solid transparent;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}.primary-btn{background:var(--primary);color:#fff}.primary-btn:hover{background:var(--primary-dark)}.secondary-btn{background:#fff;border-color:#9db8e8;color:var(--primary)}.ghost-btn{background:#f7f9fc;border-color:var(--line);color:#344054}.danger-btn{background:var(--danger);color:#fff}.compact{padding:8px 11px}.danger-link{border:0;background:transparent;color:var(--danger);padding:5px}.link-btn{min-height:42px}.file-label{cursor:pointer}.feedback{margin-top:10px;font-size:13px;min-height:18px}.feedback.ok{color:var(--success)}.feedback.error{color:var(--danger)}
.stops-list,.route-list,.saved-list{display:flex;flex-direction:column;gap:8px}.empty-state{min-height:72px;display:grid;place-items:center}.empty-message{color:var(--muted);font-size:14px;text-align:center;padding:16px}.stop-item,.route-item,.saved-item{border:1px solid var(--line);border-radius:12px;background:#fbfcfe}.stop-item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:10px}.drag{color:#8a94a5;cursor:grab}.stop-main strong,.route-main strong{display:block;font-size:14px}.stop-main span,.route-main span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.stop-actions{display:flex;gap:5px}.mini-btn{border:0;background:transparent;padding:5px;color:#556070}.mini-btn.danger{color:var(--danger)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:11px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;margin-top:4px;font-size:17px}.toggle-row{margin:12px 0}.switch-label{display:flex;align-items:center;gap:8px;color:#465166;font-size:14px}.route-item{display:grid;grid-template-columns:34px 1fr auto;gap:9px;padding:10px;align-items:center}.route-number{width:28px;height:28px;border-radius:999px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800}.route-time{text-align:right;font-size:13px}.route-time strong{display:block}.route-actions{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}.status-select{border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#fff}.nav-link{color:var(--primary);font-weight:700;text-decoration:none;font-size:13px}
.map-column{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);position:sticky;top:16px}.map-toolbar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}.map-toolbar strong,.map-toolbar span{display:block}.map-toolbar span{font-size:12px;color:var(--muted);margin-top:2px}.map-actions{display:flex;gap:8px}#map{height:calc(100vh - 165px);min-height:610px;background:#e9eef5}.map-footnote{padding:8px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.saved-item{padding:14px;display:grid;grid-template-columns:1fr auto;gap:12px}.saved-meta{color:var(--muted);font-size:13px;margin-top:5px}.saved-actions{display:flex;gap:8px;align-items:center}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field-label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}.dialog{border:0;border-radius:16px;padding:20px;width:min(420px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.2)}.dialog::backdrop{background:rgba(10,20,35,.45)}.mobile-only{display:none}
.custom-marker{background:transparent;border:0}.marker-bubble{width:31px;height:31px;border-radius:999px;display:grid;place-items:center;color:#fff;font-weight:800;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.25)}.marker-start{background:#198754}.marker-stop{background:#1267ef}.marker-end{background:#d94343}
@media (max-width:1100px){.app-shell{grid-template-columns:76px 1fr}.sidebar{padding:18px 8px}.brand div:last-child,.nav-item span,.side-note{display:none}.brand{justify-content:center;padding:0 0 18px}.nav-item{justify-content:center;font-size:20px}.planner-grid{grid-template-columns:420px minmax(0,1fr)}}
@media (max-width:850px){.app-shell{display:block}.sidebar{position:fixed;left:-255px;top:0;width:235px;transition:left .2s}.sidebar.open{left:0}.main{padding:12px}.mobile-only{display:inline-flex}.topbar h1{font-size:20px}.topbar p{font-size:12px}.planner-grid{display:flex;flex-direction:column}.control-column,.map-column{width:100%}.map-column{position:relative;top:auto;order:-1}#map{height:48vh;min-height:360px}.settings-grid{grid-template-columns:1fr}.top-actions .ghost-btn{display:none}}
@media (max-width:520px){.topbar{align-items:flex-start}.top-actions{flex-direction:column}.topbar p{display:none}.card{padding:14px}.row.gap,.stack-mobile{flex-direction:column}.metrics{grid-template-columns:1fr}.button-row{flex-wrap:wrap}.button-row>*{flex:1}.map-toolbar{align-items:flex-start}.map-actions{flex-direction:column}.saved-item{grid-template-columns:1fr}.saved-actions{justify-content:flex-start}}


.drive-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 16px;padding:12px 16px;border:1px solid var(--border,#dfe5ee);border-radius:14px;background:#fff}.drive-bar>div:first-child{display:flex;flex-direction:column;gap:3px}.drive-status{font-size:.88rem;color:#52606d}.drive-status.ok{color:#16803c}.drive-status.pending{color:#8a5a00}.drive-status.error{color:#c23838}.drive-status.warning{color:#8a5a00}@media(max-width:700px){.drive-bar{align-items:flex-start;flex-direction:column}.drive-bar .button-row{width:100%}.drive-bar .button-row button{flex:1}}
</style>
